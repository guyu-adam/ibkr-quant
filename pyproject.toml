[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "3.0.0"
description = "Multi-market quantitative trading system — US/HK/crypto/A-shares"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "guyu-adam", email = "dhuojian@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "ib_insync>=0.9.86",
    "yfinance>=1.3.0",
    "pandas>=1.4",
    "numpy>=1.23",
    "pytz>=2023.3",
    "requests>=2.28",
    "riskfolio-lib>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "hmmlearn>=0.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "python-okx>=1.0.0",
    "python-dotenv>=1.0.0",
    "flask>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.13",
]

[project.scripts]
quant = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "strategies*", "interfaces*", "paper_trading*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
